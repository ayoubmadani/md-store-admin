<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MD Admin</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MD Admin" />
    <style>
      /* شاشة البداية: تظهر فوراً قبل تحميل الكود (src/lib/splash.js يخفيها) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(60% 40% at 50% 42%, rgba(234, 179, 8, .16), transparent 70%), #09090b;
        font-family: system-ui, sans-serif; transition: opacity .3s ease; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; filter: drop-shadow(0 18px 40px rgba(234, 179, 8, .45)); }
      #splash .bar { position: relative; width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 6px; }
      #splash .bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #eab308, #fde047); animation: splash-bar 1.1s ease-in-out infinite alternate; }
      @keyframes splash-bar { from { left: 0; } to { left: 60%; } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; left: 30%; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-512.png" alt="" width="120" height="120" />
      <span class="bar"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
